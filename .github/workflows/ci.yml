name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version's patch number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit & UI tests with 100% line-coverage gate
        run: ./gradlew :app:testDebugUnitTest :app:coverageVerify

      - name: Mutation tests (threshold 80%)
        run: ./gradlew :app:pitest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Compute version
        if: github.event_name == 'push'
        id: version
        run: echo "v=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2).$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots (written by ScreenshotsTest)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-v${{ steps.version.outputs.v }}
          path: app/build/screenshots
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/coverageReport
            app/build/reports/pitest
          retention-days: 14
