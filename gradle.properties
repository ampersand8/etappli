org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Use standalone KGP 2.4.x instead of AGP's built-in Kotlin (2.2.10): maps-compose 8.5+
# needs Kotlin 2.4 metadata. (This outlived MapLibre, which needed the same thing.)
# Revisit when AGP bundles Kotlin >= 2.4 — this opt-out is removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
kotlin.code.style=official
# Semver major.minor; the patch is the git commit count (see app/build.gradle.kts).
appVersionBase=0.1
